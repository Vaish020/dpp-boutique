// ─── HELPER: Submit via Google Forms pre-fill URL ───────────────
function submitToGoogleForm(data) {
  const isConfigured = GOOGLE_FORM_ID !== "YOUR_FORM_ID_HERE" && !ENTRY_IDS.timestamp.startsWith("ENTRY_ID");
  if (!isConfigured) return "not_configured";

  try {
    const E = ENTRY_IDS;
    const params = new URLSearchParams({
      ["entry." + E.timestamp]: data.timestamp,
      ["entry." + E.scenario]: data.scenario,
      ["entry." + E.wtp]: String(data.wtp_premium_pct),
      ["entry." + E.demo_age]: data.demographics?.age || "",
      ["entry." + E.demo_gender]: data.demographics?.gender || "",
      ["entry." + E.demo_income]: data.demographics?.income || "",
      ["entry." + E.demo_luxury]: data.demographics?.luxury_freq || "",
      ["entry." + E.demo_sust]: data.demographics?.sust_awareness || "",
      ["entry." + E.gw0]: String(data.likert?.greenwash_0 || ""),
      ["entry." + E.gw1]: String(data.likert?.greenwash_1 || ""),
      ["entry." + E.gw2]: String(data.likert?.greenwash_2 || ""),
      ["entry." + E.gw3]: String(data.likert?.greenwash_3 || ""),
      ["entry." + E.csr0]: String(data.likert?.csr_auth_0 || ""),
      ["entry." + E.csr1]: String(data.likert?.csr_auth_1 || ""),
      ["entry." + E.csr2]: String(data.likert?.csr_auth_2 || ""),
      ["entry." + E.csr3]: String(data.likert?.csr_auth_3 || ""),
      ["entry." + E.fc0]: String(data.likert?.face_consc_0 || ""),
      ["entry." + E.fc1]: String(data.likert?.face_consc_1 || ""),
      ["entry." + E.fc2]: String(data.likert?.face_consc_2 || ""),
      ["entry." + E.fc3]: String(data.likert?.face_consc_3 || ""),
      ["entry." + E.bt0]: String(data.likert?.trust_0 || ""),
      ["entry." + E.bt1]: String(data.likert?.trust_1 || ""),
      ["entry." + E.bt2]: String(data.likert?.trust_2 || ""),
      ["entry." + E.bt3]: String(data.likert?.trust_3 || ""),
      ["entry." + E.ss0]: String(data.likert?.social_share_0 || ""),
      ["entry." + E.ss1]: String(data.likert?.social_share_1 || ""),
      ["entry." + E.ss2]: String(data.likert?.social_share_2 || ""),
    });

    const url = `https://docs.google.com/forms/d/e/${GOOGLE_FORM_ID}/formResponse`;

    // Submit via fetch POST (no-cors)
    fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: params.toString()
    }).catch(() => {});

    return "sent";
  } catch(e) {
    console.error("Google Form submit failed:", e);
    return "failed";
  }
}

function saveResponse(data) {
  try {
    const existing = JSON.parse(localStorage.getItem("dpp_responses") || "[]");
    existing.push(data);
    localStorage.setItem("dpp_responses", JSON.stringify(existing));
  } catch(e) { console.error("localStorage save failed:", e); }
}

function downloadCSV() {
  try {
    const responses = JSON.parse(localStorage.getItem("dpp_responses") || "[]");
    if (!responses.length) { alert("No responses collected yet."); return; }
    const allKeys = new Set();
    const flat = responses.map(r => {
      const row = { timestamp: r.timestamp, scenario: r.scenario, wtp_premium_pct: r.wtp_premium_pct };
      Object.entries(r.demographics || {}).forEach(([k,v]) => { row["demo_"+k] = v; allKeys.add("demo_"+k); });
      Object.entries(r.likert || {}).forEach(([k,v]) => { row["likert_"+k] = v; allKeys.add("likert_"+k); });
      return row;
    });
    const headers = ["timestamp","scenario","wtp_premium_pct",...[...allKeys].sort()];
    const csv = [headers.join(","), ...flat.map(r => headers.map(h => JSON.stringify(r[h] || "")).join(","))].join("\n");
    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `DPP_Responses_${new Date().toISOString().slice(0,10)}.csv`; a.click();
    URL.revokeObjectURL(url);
  } catch(e) { alert("Export error: "+e.message); }
}

  return <div style={{padding:20,background:"#fff",borderRadius:10,border:`1px solid ${CREAM_DARK}`,marginBottom:16}}>
    <h3 style={{fontFamily:DISPLAY,fontSize:16,color:INK,margin:"0 0 2px"}}>{construct.title}</h3>
    <p style={{fontFamily:BODY,fontSize:10,color:INK_LIGHT,margin:"0 0 16px",fontStyle:"italic"}}>{construct.ref}</p>
    {construct.items.map((item,idx)=>{
      const key=`${construct.id}_${idx}`;
      return <div key={idx} style={{marginBottom:16,paddingBottom:16,borderBottom:idx<construct.items.length-1?`1px solid ${CREAM_DARK}`:"none"}}>
        <p style={{fontFamily:BODY,fontSize:13,color:INK,margin:"0 0 10px",lineHeight:1.5}}>{idx+1}. {item}</p>
        <div style={{display:"flex",justifyContent:"space-between",gap:4}}>
          {LIKERT_LABELS.map((label,li)=><button key={li} onClick={()=>onChange(key,li+1)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"6px 2px",border:responses[key]===li+1?`2px solid ${PLUM}`:`1px solid ${CREAM_DARK}`,borderRadius:6,background:responses[key]===li+1?PLUM:"#fff",cursor:"pointer",transition:"all 0.15s",minWidth:0}}>
            <span style={{fontSize:14,fontWeight:700,fontFamily:BODY,color:responses[key]===li+1?CREAM:INK}}>{li+1}</span>
            <span style={{fontSize:8,fontFamily:BODY,color:responses[key]===li+1?GOLD_LIGHT:INK_LIGHT,textAlign:"center",lineHeight:1.2,whiteSpace:"pre-line"}}>{label}</span>
          </button>)}
        </div>
      </div>
    })}
  </div>
}

function DemographicsBlock({responses,onChange}){
  return <div style={{padding:20,background:"#fff",borderRadius:10,border:`1px solid ${CREAM_DARK}`,marginBottom:16}}>
    <h3 style={{fontFamily:DISPLAY,fontSize:16,color:INK,margin:"0 0 4px"}}>Demographic Information</h3>
    <p style={{fontFamily:BODY,fontSize:11,color:INK_LIGHT,margin:"0 0 16px"}}>Your responses are anonymous and used only for research segmentation.</p>
    {DEMO_QUESTIONS.map(dq=><div key={dq.id} style={{marginBottom:18}}>
      <p style={{fontFamily:BODY,fontSize:13,fontWeight:600,color:INK,margin:"0 0 8px"}}>{dq.q}</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
        {dq.options.map(opt=><button key={opt} onClick={()=>onChange(dq.id,opt)} style={{padding:"8px 14px",borderRadius:20,fontFamily:BODY,fontSize:12,cursor:"pointer",transition:"all 0.2s",border:responses[dq.id]===opt?`2px solid ${PLUM}`:`1px solid ${CREAM_DARK}`,background:responses[dq.id]===opt?PLUM:"#fff",color:responses[dq.id]===opt?CREAM:INK,fontWeight:responses[dq.id]===opt?600:400}}>{opt}</button>)}
      </div>
    </div>)}
  </div>
}

function CompletionScreen({scenario,data,responseCount,sheetStatus}){
  return <div style={{maxWidth:520,margin:"0 auto",textAlign:"center",padding:"40px 20px"}}>
    <div style={{fontSize:64,marginBottom:16}}>✓</div>
    <h2 style={{fontFamily:DISPLAY,fontSize:28,color:INK,margin:"0 0 8px"}}>Thank You</h2>
    <p style={{fontFamily:BODY,fontSize:14,color:INK_LIGHT,lineHeight:1.7}}>Your responses have been recorded successfully.</p>

    {/* Submission status */}
    {sheetStatus==="sent"&&<div style={{marginTop:16,padding:12,background:GREEN_LIGHT,borderRadius:8,border:`1px solid ${GREEN_ACCENT}`}}>
      <p style={{fontFamily:BODY,fontSize:12,color:GREEN_ACCENT,fontWeight:600,margin:0}}>✓ Response submitted to Google Forms</p>
    </div>}
    {sheetStatus==="failed"&&<div style={{marginTop:16,padding:12,background:"#FFF0F0",borderRadius:8,border:"1px solid #C1121F"}}>
      <p style={{fontFamily:BODY,fontSize:12,color:RED_SOFT,fontWeight:600,margin:0}}>Response saved locally (Google Forms submission failed)</p>
    </div>}
    {sheetStatus==="not_configured"&&<div style={{marginTop:16,padding:12,background:"#FFF8E1",borderRadius:8,border:"1px solid #FFD54F"}}>
      <p style={{fontFamily:BODY,fontSize:12,color:"#E65100",fontWeight:600,margin:0}}>⚠ Google Form not configured — response saved locally only</p>
    </div>}

    <GoldDivider width={100} my={20}/>
    <p style={{fontFamily:BODY,fontSize:12,color:INK_LIGHT}}>This simulation is part of an International Business Research project at SP Jain School of Global Management, investigating trust-weighted transparency frameworks for sustainable luxury fashion brands in the Dubai market.</p>

    {/* Researcher panel — hidden from respondents, accessed via ?admin=true URL param */}
    {new URLSearchParams(window.location.search).get("admin")==="true"&&<div style={{marginTop:24,padding:16,background:"#FFF8E1",borderRadius:8,border:"1px solid #FFD54F"}}>
      <p style={{fontFamily:BODY,fontSize:11,fontWeight:700,color:INK,marginBottom:8}}>🔬 Researcher Panel — {responseCount} local response(s)</p>
      <p style={{fontFamily:BODY,fontSize:10,color:INK_LIGHT,margin:"0 0 12px"}}>Google Forms: {GOOGLE_FORM_ID !== "YOUR_FORM_ID_HERE" ? "✓ Configured" : "✗ Not set — edit GOOGLE_FORM_ID and ENTRY_IDS in the HTML file"}</p>
      <button onClick={downloadCSV} style={{padding:"10px 24px",background:PLUM,color:CREAM,border:"none",borderRadius:6,fontFamily:BODY,fontSize:12,fontWeight:600,cursor:"pointer",marginRight:8}}>📥 Download Local CSV</button>
      <button onClick={()=>{if(confirm("Clear ALL locally stored responses?")){localStorage.removeItem("dpp_responses");alert("Cleared.")}}} style={{padding:"10px 24px",background:"#fff",color:RED_SOFT,border:`1px solid ${RED_SOFT}`,borderRadius:6,fontFamily:BODY,fontSize:12,fontWeight:600,cursor:"pointer"}}>🗑 Clear Local Data</button>
    </div>}
  </div>
}

// ─── MAIN APP ──────────────────────────────────────────────────
function App(){
  const[phase,setPhase]=useState("intro");
  const[scenario,setScenario]=useState(null);
  const[wtp,setWtp]=useState(10);
  const[likertResponses,setLikertResponses]=useState({});
  const[demoResponses,setDemoResponses]=useState({});
  const[consentChecked,setConsentChecked]=useState(false);
  const[responseCount,setResponseCount]=useState(0);
  const[sheetStatus,setSheetStatus]=useState(null); // null | "sending" | "sent" | "failed" | "no_url"
  const[submitting,setSubmitting]=useState(false);

  useEffect(()=>{
    setScenario(Math.random()<0.5?"A":"B");
    try{const r=JSON.parse(localStorage.getItem("dpp_responses")||"[]");setResponseCount(r.length)}catch(e){}
  },[]);

  const scrollTop=()=>window.scrollTo({top:0,behavior:"smooth"});
  const handleLikert=(key,val)=>setLikertResponses(prev=>({...prev,[key]:val}));
  const handleDemo=(id,val)=>setDemoResponses(prev=>({...prev,[id]:val}));

  const handleSubmit=async()=>{
    if(submitting)return;
    setSubmitting(true);
    const allData={scenario,demographics:demoResponses,wtp_premium_pct:wtp,likert:likertResponses,timestamp:new Date().toISOString()};
    // Save to localStorage as backup
    saveResponse(allData);
    setResponseCount(prev=>prev+1);
    // Submit to Google Forms
    const result = submitToGoogleForm(allData);
    setSheetStatus(result); // "sent" | "failed" | "not_configured"
    setPhase("complete");
    scrollTop();
  };

  return <div style={{fontFamily:BODY,background:CREAM,minHeight:"100vh"}}>
    {/* Header */}
    <header style={{padding:"16px 20px",borderBottom:`1px solid ${CREAM_DARK}`,display:"flex",alignItems:"center",justifyContent:"space-between",background:"#fff"}}>
      <div><h1 style={{fontFamily:DISPLAY,fontSize:18,fontWeight:700,color:INK,margin:0,letterSpacing:0.5}}>MAISON ÉLYSE</h1><p style={{fontFamily:BODY,fontSize:9,color:GOLD,letterSpacing:3,margin:0,textTransform:"uppercase"}}>Paris · Milan · Dubai</p></div>
    </header>

    <main style={{maxWidth:600,margin:"0 auto",padding:"24px 16px 60px"}}>
      {/* INTRO */}
      {phase==="intro"&&<div style={{textAlign:"center",padding:"40px 16px"}}>
        <Badge>Research Simulation</Badge>
        <h2 style={{fontFamily:DISPLAY,fontSize:30,color:INK,margin:"20px 0 8px",lineHeight:1.3}}>The Virtual Boutique</h2>
        <p style={{fontFamily:DISPLAY,fontSize:16,color:GOLD,fontStyle:"italic",margin:"0 0 20px"}}>DPP Experimental Vignette Design</p>
        <GoldDivider width={80}/>
        <p style={{fontFamily:BODY,fontSize:13,color:INK_LIGHT,lineHeight:1.8,maxWidth:440,margin:"0 auto 24px"}}>You are about to browse a simulated luxury fashion product page. Please examine the product and its sustainability information carefully, as you would in a real online shopping experience. You will then be asked about your perceptions and purchase intentions.</p>
        <div style={{padding:16,background:"#fff",borderRadius:8,border:`1px solid ${CREAM_DARK}`,textAlign:"left",marginBottom:24}}>
          <p style={{fontFamily:BODY,fontSize:12,fontWeight:600,color:INK,margin:"0 0 6px"}}>What to expect:</p>
          {["Browse a luxury product page (~2 min)","Answer questions about your experience (~5 min)","Provide brief demographic information (~1 min)"].map((step,i)=><p key={i} style={{fontFamily:BODY,fontSize:12,color:INK_LIGHT,margin:"4px 0",display:"flex",gap:8}}><span style={{color:GOLD,fontWeight:700}}>{i+1}.</span> {step}</p>)}
        </div>
        <button onClick={()=>{setPhase("consent");scrollTop()}} style={{padding:"14px 48px",background:PLUM,color:CREAM,border:"none",borderRadius:8,fontFamily:BODY,fontSize:14,fontWeight:600,letterSpacing:1,cursor:"pointer"}}>BEGIN</button>
      </div>}

      {/* CONSENT */}
      {phase==="consent"&&<div style={{padding:"20px 0"}}>
        <h2 style={{fontFamily:DISPLAY,fontSize:22,color:INK,margin:"0 0 16px"}}>Informed Consent</h2>
        <div style={{padding:20,background:"#fff",borderRadius:10,border:`1px solid ${CREAM_DARK}`,marginBottom:20,fontSize:12,fontFamily:BODY,color:INK_LIGHT,lineHeight:1.8}}>
          <p><strong style={{color:INK}}>Title:</strong> Bridging the Credibility Chasm: Defining a Trust-Weighted Transparency Framework for Sustainable Luxury Fashion Brands in the Dubai Market</p>
          <p><strong style={{color:INK}}>Researcher:</strong> Vaishnavi Murugan</p>
          <GoldDivider width={120} my={12}/>
          <p>Your participation in this study is entirely voluntary. You may withdraw at any time without penalty. Your responses will be kept anonymous and confidential, used solely for academic research purposes. No personally identifiable information will be collected or stored.</p>
          <p>The study involves viewing a simulated luxury e-commerce product page and responding to questions about your perceptions, attitudes, and purchase intentions. The entire process takes approximately 8–10 minutes.</p>
        </div>
        <label style={{display:"flex",gap:10,alignItems:"flex-start",cursor:"pointer",padding:16,background:consentChecked?`${PLUM}0A`:"#fff",border:`1px solid ${consentChecked?PLUM:CREAM_DARK}`,borderRadius:8,marginBottom:20,transition:"all 0.2s"}}>
          <input type="checkbox" checked={consentChecked} onChange={e=>setConsentChecked(e.target.checked)} style={{marginTop:2,accentColor:PLUM,width:18,height:18}}/>
          <span style={{fontFamily:BODY,fontSize:13,color:INK,lineHeight:1.6}}>I have read and understood the above information. I voluntarily agree to participate in this research study.</span>
        </label>
        <button onClick={()=>{if(consentChecked){setPhase("demographics");scrollTop()}}} disabled={!consentChecked} style={{width:"100%",padding:"14px 0",background:consentChecked?PLUM:CREAM_DARK,color:consentChecked?CREAM:INK_LIGHT,border:"none",borderRadius:8,fontFamily:BODY,fontSize:14,fontWeight:600,cursor:consentChecked?"pointer":"not-allowed"}}>CONTINUE</button>
      </div>}

      {/* DEMOGRAPHICS */}
      {phase==="demographics"&&<div style={{padding:"20px 0"}}>
        <Badge>Step 1 of 3</Badge>
        <h2 style={{fontFamily:DISPLAY,fontSize:22,color:INK,margin:"12px 0 16px"}}>About You</h2>
        <DemographicsBlock responses={demoResponses} onChange={handleDemo}/>
        <button onClick={()=>{setPhase("scenario");scrollTop()}} style={{width:"100%",padding:"14px 0",background:PLUM,color:CREAM,border:"none",borderRadius:8,fontFamily:BODY,fontSize:14,fontWeight:600,cursor:"pointer"}}>VIEW PRODUCT →</button>
      </div>}

      {/* SCENARIO */}
      {phase==="scenario"&&<div style={{padding:"20px 0"}}>
        <Badge>Step 2 of 3</Badge>
        <h2 style={{fontFamily:DISPLAY,fontSize:22,color:INK,margin:"12px 0 4px"}}>Browse the Product</h2>
        <p style={{fontFamily:BODY,fontSize:12,color:INK_LIGHT,margin:"0 0 20px"}}>Please examine this product page carefully, including all sustainability information, as if you were genuinely considering a purchase.</p>
        {scenario==="A"?<ScenarioA onComplete={()=>{setPhase("measures");scrollTop()}}/>:<ScenarioB onComplete={()=>{setPhase("measures");scrollTop()}}/>}
        <div style={{marginTop:20,textAlign:"center"}}><button onClick={()=>{setPhase("measures");scrollTop()}} style={{padding:"12px 36px",background:"transparent",color:PLUM,border:`2px solid ${PLUM}`,borderRadius:8,fontFamily:BODY,fontSize:13,fontWeight:600,cursor:"pointer"}}>PROCEED TO QUESTIONS →</button></div>
      </div>}

      {/* MEASURES */}
      {phase==="measures"&&<div style={{padding:"20px 0"}}>
        <Badge>Step 3 of 3</Badge>
        <h2 style={{fontFamily:DISPLAY,fontSize:22,color:INK,margin:"12px 0 4px"}}>Your Perceptions</h2>
        <p style={{fontFamily:BODY,fontSize:12,color:INK_LIGHT,margin:"0 0 20px"}}>Based on what you just saw on the product page, please rate your agreement with each statement below using the 7-point scale.</p>
        <WTPSlider value={wtp} onChange={setWtp}/>
        {CONSTRUCTS.map(c=><LikertBlock key={c.id} construct={c} responses={likertResponses} onChange={handleLikert}/>)}
        <button onClick={handleSubmit} disabled={submitting} style={{width:"100%",padding:"16px 0",background:submitting?INK_LIGHT:`linear-gradient(135deg,${PLUM},${PLUM_LIGHT})`,color:CREAM,border:"none",borderRadius:8,fontFamily:BODY,fontSize:15,fontWeight:700,letterSpacing:1,cursor:submitting?"not-allowed":"pointer",marginTop:8}}>{submitting?"SUBMITTING...":"SUBMIT RESPONSES"}</button>
      </div>}

      {/* COMPLETE */}
      {phase==="complete"&&<CompletionScreen scenario={scenario} data={{}} responseCount={responseCount} sheetStatus={sheetStatus}/>}
    </main>

    {/* Progress bar */}
    <div style={{position:"fixed",bottom:0,left:0,right:0,height:4,background:CREAM_DARK}}>
      <div style={{height:"100%",background:`linear-gradient(90deg,${GOLD},${PLUM})`,transition:"width 0.5s ease",width:phase==="intro"?"0%":phase==="consent"?"15%":phase==="demographics"?"30%":phase==="scenario"?"55%":phase==="measures"?"80%":"100%"}}/>
    </div>
  </div>
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
